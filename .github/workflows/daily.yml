name: daily-report

on:
  schedule:
    # 平日 16:10 JST（= 07:10 UTC）。後場終了後（15:30）のデータ反映を待つ。
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 休場日判定
        id: market
        run: python scripts/check_market_open.py

      - name: state ブランチ（予測DB・過去レポート）を取得
        if: steps.market.outputs.open == 'true'
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git worktree add ../state FETCH_HEAD
            mkdir -p data reports
            cp -r ../state/data/. data/ 2>/dev/null || true
            cp -r ../state/reports/. reports/ 2>/dev/null || true
          else
            echo "::warning::state ブランチがありません。予測DB・過去レポートなしで開始します（scripts/seed_state.py で初回登録してください）"
          fi

      - name: 日次レポート生成・docs公開
        if: steps.market.outputs.open == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python run_daily.py

      - name: state ブランチを更新
        if: steps.market.outputs.open == 'true'
        run: |
          rm -rf ../state-out && mkdir ../state-out
          cp -r data reports ../state-out/
          cd ../state-out
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "state: $(TZ=Asia/Tokyo date +%F)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
